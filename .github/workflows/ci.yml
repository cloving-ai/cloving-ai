{
  "name": "CI",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "tags": [
        "v*"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.ref }}",
    "cancel-in-progress": true
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "jobs": {
    "quality_macos": {
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "env": {
        "CLOVING_CHECK_TIME_FACTOR": "3",
        "CLOVING_TEST_CONCURRENCY": "3",
        "CLOVING_CI_MACOS_VERSION": "15.*",
        "NODE_OPTIONS": "--max-old-space-size=4096",
        "CLOVING_TEST_SHARD": "${{ matrix.shard }}/2",
        "CLOVING_COVERAGE_DIRECTORY": "${{ runner.temp }}/cloving-coverage/shard"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "26.9.0",
            "architecture": "arm64",
            "registry-url": "https://registry.npmjs.org",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm install --global npm@11.19.1 --ignore-scripts"
        },
        {
          "name": "Verify runner toolchain",
          "run": "node --input-type=module -e 'import assert from \"node:assert/strict\"; assert.equal(process.version, \"v26.9.0\"); assert.equal(process.platform, \"darwin\"); assert.equal(process.arch, \"arm64\");'\ntest \"$(npm --version)\" = \"11.19.1\"\ncase \"$(sw_vers -productVersion)\" in $CLOVING_CI_MACOS_VERSION) ;; *) exit 1 ;; esac"
        },
        {
          "run": "npm ci --ignore-scripts"
        },
        {
          "run": "npm run check:setup",
          "if": "${{ matrix.shard == '1' }}"
        },
        {
          "run": "npm run check:quality"
        },
        {
          "run": "npm run build",
          "if": "${{ matrix.shard == '1' }}"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "coverage-macos-26.9.0-${{ matrix.shard }}",
            "path": "${{ env.CLOVING_COVERAGE_DIRECTORY }}",
            "if-no-files-found": "error",
            "overwrite": true
          }
        }
      ],
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "shard": [
            "1",
            "2"
          ]
        }
      }
    },
    "quality_linux_node": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            "24.22.1",
            "26.9.0"
          ],
          "shard": [
            "1",
            "2"
          ]
        }
      },
      "env": {
        "CLOVING_CHECK_TIME_FACTOR": "3",
        "CLOVING_TEST_CONCURRENCY": "4",
        "CLOVING_CI_ARCHITECTURE": "x64",
        "NODE_OPTIONS": "--max-old-space-size=4096",
        "CLOVING_TEST_SHARD": "${{ matrix.shard }}/2",
        "CLOVING_COVERAGE_DIRECTORY": "${{ runner.temp }}/cloving-coverage/shard"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "${{ matrix.node }}",
            "architecture": "${{ env.CLOVING_CI_ARCHITECTURE }}",
            "registry-url": "https://registry.npmjs.org",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm install --global npm@11.19.1 --ignore-scripts"
        },
        {
          "name": "Verify runner toolchain",
          "run": "node --input-type=module -e 'import assert from \"node:assert/strict\"; assert.equal(process.version, \"v${{ matrix.node }}\"); assert.equal(process.platform, \"linux\"); assert.equal(process.arch, process.env.CLOVING_CI_ARCHITECTURE);'\ntest \"$(npm --version)\" = \"11.19.1\""
        },
        {
          "run": "npm ci --ignore-scripts"
        },
        {
          "id": "prepare-shells",
          "name": "Install zsh when missing",
          "run": "if ! test -x /bin/zsh; then\n  sudo apt-get update\n  sudo apt-get install -y zsh\nfi"
        },
        {
          "run": "npm run check:setup",
          "if": "${{ matrix.shard == '1' }}"
        },
        {
          "run": "npm run check:quality"
        },
        {
          "run": "npm run build",
          "if": "${{ matrix.shard == '1' }}"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "coverage-linux-${{ matrix.node }}-${{ matrix.shard }}",
            "path": "${{ env.CLOVING_COVERAGE_DIRECTORY }}",
            "if-no-files-found": "error",
            "overwrite": true
          }
        }
      ]
    },
    "coverage": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "needs": [
        "quality_macos",
        "quality_linux_node"
      ],
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "26.9.0",
            "architecture": "x64",
            "registry-url": "https://registry.npmjs.org",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm install --global npm@11.19.1 --ignore-scripts"
        },
        {
          "run": "npm ci --ignore-scripts"
        },
        {
          "uses": "actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0",
          "with": {
            "pattern": "coverage-*",
            "path": "${{ runner.temp }}/cloving-coverage"
          }
        },
        {
          "run": "node tools/check-shard-coverage.ts \"$RUNNER_TEMP/cloving-coverage/coverage-macos-26.9.0-1\" \"$RUNNER_TEMP/cloving-coverage/coverage-macos-26.9.0-2\" \"$RUNNER_TEMP/cloving-coverage/coverage-linux-24.22.1-1\" \"$RUNNER_TEMP/cloving-coverage/coverage-linux-24.22.1-2\" \"$RUNNER_TEMP/cloving-coverage/coverage-linux-26.9.0-1\" \"$RUNNER_TEMP/cloving-coverage/coverage-linux-26.9.0-2\""
        }
      ]
    },
    "quality": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "needs": [
        "quality_macos",
        "coverage"
      ],
      "if": "${{ always() }}",
      "steps": [
        {
          "name": "Require every shard and combined coverage",
          "env": {
            "SHARD_RESULT": "${{ needs.quality_macos.result }}",
            "COVERAGE_RESULT": "${{ needs.coverage.result }}"
          },
          "run": "test \"$SHARD_RESULT\" = success\ntest \"$COVERAGE_RESULT\" = success"
        }
      ]
    },
    "quality_linux": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "needs": [
        "quality_linux_node",
        "coverage"
      ],
      "if": "${{ always() }}",
      "steps": [
        {
          "name": "Require every shard and combined coverage",
          "env": {
            "SHARD_RESULT": "${{ needs.quality_linux_node.result }}",
            "COVERAGE_RESULT": "${{ needs.coverage.result }}"
          },
          "run": "test \"$SHARD_RESULT\" = success\ntest \"$COVERAGE_RESULT\" = success"
        }
      ]
    },
    "publish": {
      "runs-on": "macos-15",
      "timeout-minutes": 15,
      "needs": [
        "quality",
        "quality_linux"
      ],
      "if": "${{ success() && needs.quality.result == 'success' && needs.quality_linux.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}",
      "permissions": {
        "contents": "write",
        "id-token": "write"
      },
      "concurrency": {
        "group": "npm-release-${{ github.ref }}",
        "cancel-in-progress": false
      },
      "env": {
        "NPM_CONFIG_REGISTRY": "https://registry.npmjs.org"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "26.9.0",
            "architecture": "arm64",
            "registry-url": "https://registry.npmjs.org",
            "package-manager-cache": false
          }
        },
        {
          "id": "validate-tag",
          "name": "Require the manifest version tag",
          "run": "version=\"$(node -p 'require(\"./package.json\").version')\"\ntest \"$GITHUB_REF_NAME\" = \"v$version\"\ntest \"$GITHUB_REF\" = \"refs/tags/$GITHUB_REF_NAME\""
        },
        {
          "run": "npm install --global npm@11.19.1 --ignore-scripts"
        },
        {
          "run": "npm ci --ignore-scripts"
        },
        {
          "run": "npm run build"
        },
        {
          "id": "publish-package",
          "name": "Publish a confirmed missing version with OIDC",
          "run": "version=\"$(node -p 'require(\"./package.json\").version')\"\nmetadata=\"$(mktemp)\"\ntrap 'rm -f \"$metadata\"' EXIT\nif npm view \"cloving@$version\" version --json > \"$metadata\"; then\n  node --input-type=module -e 'import { readFileSync } from \"node:fs\"; if (JSON.parse(readFileSync(process.argv[1], \"utf8\")) !== process.argv[2]) throw new Error(\"unexpected-registry-version\");' \"$metadata\" \"$version\"\nelse\n  node --input-type=module -e 'import { readFileSync } from \"node:fs\"; if (JSON.parse(readFileSync(process.argv[1], \"utf8\"))?.error?.code !== \"E404\") throw new Error(\"registry-lookup-failed\");' \"$metadata\"\n  npm publish --access public --ignore-scripts\nfi"
        },
        {
          "id": "github-release",
          "name": "Create a missing GitHub release",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "response=\"$(mktemp)\"\ntrap 'rm -f \"$response\"' EXIT\nif gh api --include \"repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME\" > \"$response\"; then\n  exit 0\nfi\nnode --input-type=module -e 'import { readFileSync } from \"node:fs\"; if (!/^HTTP\\/[\\d.]+ 404\\b/m.test(readFileSync(process.argv[1], \"utf8\"))) throw new Error(\"release-lookup-failed\");' \"$response\"\ngh release create \"$GITHUB_REF_NAME\" --repo \"$GITHUB_REPOSITORY\" --verify-tag --target \"$GITHUB_SHA\" --generate-notes"
        }
      ]
    }
  }
}
