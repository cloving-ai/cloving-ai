{
  "name": "CI",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "tags": [
        "v*"
      ]
    },
    "pull_request": {},
    "merge_group": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.ref }}",
    "cancel-in-progress": true
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "jobs": {
    "quality_macos": {
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "if": "${{ github.ref_type != 'tag' }}",
      "env": {
        "CLOVING_CHECK_TIME_FACTOR": "3",
        "CLOVING_TEST_CONCURRENCY": "3",
        "CLOVING_CI_MACOS_VERSION": "15.*",
        "NODE_OPTIONS": "--max-old-space-size=4096",
        "CLOVING_TEST_SET": "${{ matrix.shard == 'platform' && 'platform' || 'all' }}",
        "CLOVING_TEST_SHARD": "${{ matrix.shard == 'platform' && '1/1' || format('{0}/3', matrix.shard) }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 2,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "26.9.0",
            "architecture": "arm64",
            "registry-url": "https://registry.npmjs.org",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm install --global npm@11.19.1 --ignore-scripts"
        },
        {
          "name": "Verify runner toolchain",
          "run": "node --input-type=module -e 'import assert from \"node:assert/strict\"; assert.equal(process.version, \"v26.9.0\"); assert.equal(process.platform, \"darwin\"); assert.equal(process.arch, \"arm64\");'\ntest \"$(npm --version)\" = \"11.19.1\"\ncase \"$(sw_vers -productVersion)\" in $CLOVING_CI_MACOS_VERSION) ;; *) exit 1 ;; esac"
        },
        {
          "run": "npm ci --ignore-scripts"
        },
        {
          "run": "npm run check:setup",
          "if": "${{ matrix.shard == '1' || matrix.shard == 'platform' }}"
        },
        {
          "id": "changed-paths",
          "name": "List the changed paths of the pull request",
          "if": "${{ github.event_name == 'pull_request' }}",
          "run": "git diff --name-only --no-renames -z HEAD^1 HEAD > \"$RUNNER_TEMP/changed-paths\"\necho \"CLOVING_CHANGED_PATHS=$RUNNER_TEMP/changed-paths\" >> \"$GITHUB_ENV\""
        },
        {
          "run": ": > \"$CLOVING_TEST_PROGRESS_FILE\"\ntail -n +1 -f \"$CLOVING_TEST_PROGRESS_FILE\" &\nprogress=$!\ntrap 'kill \"$progress\"' EXIT\nnpm run check:quality",
          "env": {
            "CLOVING_TEST_PROGRESS_FILE": "${{ runner.temp }}/cloving-test-progress.log",
            "CLOVING_COVERAGE_DIRECTORY": "${{ runner.temp }}/cloving-coverage/shard",
            "CLOVING_TEST_COVERAGE": "${{ github.event_name == 'pull_request' && 'on' || 'off' }}"
          }
        },
        {
          "if": "${{ github.event_name == 'pull_request' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "coverage-macos-26.9.0-${{ matrix.shard }}",
            "path": "${{ runner.temp }}/cloving-coverage/shard",
            "if-no-files-found": "error",
            "overwrite": true
          }
        },
        {
          "id": "test-report",
          "name": "Find the folder of the full test report",
          "if": "${{ failure() }}",
          "run": "echo \"directory=$(node -p \"require('node:os').tmpdir()\")\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "test-report-macos-26.9.0-${{ matrix.shard }}",
            "path": "${{ steps.test-report.outputs.directory }}/cloving-test-report-*.json",
            "if-no-files-found": "ignore",
            "retention-days": 7,
            "overwrite": true
          }
        }
      ],
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "shard": "${{ fromJSON(github.event_name == 'pull_request' && '[\"platform\"]' || '[\"1\",\"2\",\"3\"]') }}"
        }
      }
    },
    "quality_linux_node": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "if": "${{ github.ref_type != 'tag' }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": "${{ fromJSON(github.event_name == 'pull_request' && '[\"26.9.0\"]' || '[\"24.22.1\",\"26.9.0\"]') }}",
          "shard": "${{ fromJSON(github.event_name == 'pull_request' && '[\"1\",\"2\",\"3\",\"4\",\"5\",\"6\"]' || '[\"1\",\"2\",\"3\"]') }}"
        }
      },
      "env": {
        "CLOVING_CHECK_TIME_FACTOR": "3",
        "CLOVING_TEST_CONCURRENCY": "4",
        "CLOVING_CI_ARCHITECTURE": "x64",
        "NODE_OPTIONS": "--max-old-space-size=4096",
        "CLOVING_TEST_SHARD": "${{ format('{0}/{1}', matrix.shard, github.event_name == 'pull_request' && '6' || '3') }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 2,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "${{ matrix.node }}",
            "architecture": "${{ env.CLOVING_CI_ARCHITECTURE }}",
            "registry-url": "https://registry.npmjs.org",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm install --global npm@11.19.1 --ignore-scripts"
        },
        {
          "name": "Verify runner toolchain",
          "run": "node --input-type=module -e 'import assert from \"node:assert/strict\"; assert.equal(process.version, \"v${{ matrix.node }}\"); assert.equal(process.platform, \"linux\"); assert.equal(process.arch, process.env.CLOVING_CI_ARCHITECTURE);'\ntest \"$(npm --version)\" = \"11.19.1\""
        },
        {
          "run": "npm ci --ignore-scripts"
        },
        {
          "id": "prepare-shells",
          "name": "Install zsh when missing",
          "timeout-minutes": 3,
          "run": "if ! test -x /bin/zsh; then\n  packages=\"$(mktemp -d)\"\n  trap 'rm -rf \"$packages\"' EXIT\n  base=https://archive.ubuntu.com/ubuntu/pool/main/z/zsh\n  for name in zsh-common_5.9-6ubuntu2_all zsh_5.9-6ubuntu2_amd64; do\n    curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 60 -o \"$packages/$name.deb\" \"$base/$name.deb\"\n  done\n  printf '%s  %s\\n' \\\n    56d160585b417af0cc04d7372f74a3b734609d7cc43ef8ea6e92bfdfc27f77c3 \"$packages/zsh-common_5.9-6ubuntu2_all.deb\" \\\n    bd5cc8dd3a01a6db38c0a815d75202c356a9c7f378674ba7bed9bc86dcba8af0 \"$packages/zsh_5.9-6ubuntu2_amd64.deb\" \\\n    | sha256sum --check --strict --quiet\n  sudo dpkg -i \"$packages/zsh-common_5.9-6ubuntu2_all.deb\" \"$packages/zsh_5.9-6ubuntu2_amd64.deb\"\nfi"
        },
        {
          "run": "npm run check:setup",
          "if": "${{ matrix.shard == '1' }}"
        },
        {
          "id": "changed-paths",
          "name": "List the changed paths of the pull request",
          "if": "${{ github.event_name == 'pull_request' }}",
          "run": "git diff --name-only --no-renames -z HEAD^1 HEAD > \"$RUNNER_TEMP/changed-paths\"\necho \"CLOVING_CHANGED_PATHS=$RUNNER_TEMP/changed-paths\" >> \"$GITHUB_ENV\""
        },
        {
          "run": ": > \"$CLOVING_TEST_PROGRESS_FILE\"\ntail -n +1 -f \"$CLOVING_TEST_PROGRESS_FILE\" &\nprogress=$!\ntrap 'kill \"$progress\"' EXIT\nnpm run check:quality",
          "env": {
            "CLOVING_TEST_PROGRESS_FILE": "${{ runner.temp }}/cloving-test-progress.log",
            "CLOVING_COVERAGE_DIRECTORY": "${{ runner.temp }}/cloving-coverage/shard",
            "CLOVING_TEST_COVERAGE": "${{ github.event_name == 'pull_request' && 'on' || 'off' }}"
          }
        },
        {
          "if": "${{ github.event_name == 'pull_request' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "coverage-linux-${{ matrix.node }}-${{ matrix.shard }}",
            "path": "${{ runner.temp }}/cloving-coverage/shard",
            "if-no-files-found": "error",
            "overwrite": true
          }
        },
        {
          "id": "test-report",
          "name": "Find the folder of the full test report",
          "if": "${{ failure() }}",
          "run": "echo \"directory=$(node -p \"require('node:os').tmpdir()\")\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "if": "${{ failure() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "test-report-linux-${{ matrix.node }}-${{ matrix.shard }}",
            "path": "${{ steps.test-report.outputs.directory }}/cloving-test-report-*.json",
            "if-no-files-found": "ignore",
            "retention-days": 7,
            "overwrite": true
          }
        }
      ]
    },
    "coverage": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "needs": [
        "quality_macos",
        "quality_linux_node"
      ],
      "if": "${{ github.event_name == 'pull_request' }}",
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "26.9.0",
            "architecture": "x64",
            "registry-url": "https://registry.npmjs.org",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm install --global npm@11.19.1 --ignore-scripts"
        },
        {
          "run": "npm ci --ignore-scripts"
        },
        {
          "uses": "actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0",
          "with": {
            "pattern": "coverage-*",
            "path": "${{ runner.temp }}/cloving-coverage"
          }
        },
        {
          "run": "node tools/check-shard-coverage.ts \"$RUNNER_TEMP/cloving-coverage/coverage-macos-26.9.0-platform\" \"$RUNNER_TEMP/cloving-coverage/coverage-linux-26.9.0-1\" \"$RUNNER_TEMP/cloving-coverage/coverage-linux-26.9.0-2\" \"$RUNNER_TEMP/cloving-coverage/coverage-linux-26.9.0-3\" \"$RUNNER_TEMP/cloving-coverage/coverage-linux-26.9.0-4\" \"$RUNNER_TEMP/cloving-coverage/coverage-linux-26.9.0-5\" \"$RUNNER_TEMP/cloving-coverage/coverage-linux-26.9.0-6\""
        }
      ]
    },
    "quality": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "needs": [
        "quality_macos",
        "coverage"
      ],
      "if": "${{ always() && github.ref_type != 'tag' }}",
      "steps": [
        {
          "name": "Require every shard, and combined coverage for a pull request",
          "env": {
            "SHARD_RESULT": "${{ needs.quality_macos.result }}",
            "COVERAGE_RESULT": "${{ needs.coverage.result }}",
            "EVENT_NAME": "${{ github.event_name }}"
          },
          "run": "test \"$SHARD_RESULT\" = success\ntest \"$COVERAGE_RESULT\" = success || { test \"$EVENT_NAME\" != pull_request && test \"$COVERAGE_RESULT\" = skipped; }"
        }
      ]
    },
    "quality_linux": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "needs": [
        "quality_linux_node",
        "coverage"
      ],
      "if": "${{ always() && github.ref_type != 'tag' }}",
      "steps": [
        {
          "name": "Require every shard, and combined coverage for a pull request",
          "env": {
            "SHARD_RESULT": "${{ needs.quality_linux_node.result }}",
            "COVERAGE_RESULT": "${{ needs.coverage.result }}",
            "EVENT_NAME": "${{ github.event_name }}"
          },
          "run": "test \"$SHARD_RESULT\" = success\ntest \"$COVERAGE_RESULT\" = success || { test \"$EVENT_NAME\" != pull_request && test \"$COVERAGE_RESULT\" = skipped; }"
        }
      ]
    },
    "release_check": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "if": "${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "id": "main-ci",
          "name": "Require the passed main CI of the tagged commit",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "status=\"$(gh api \"repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA\" --jq .status)\"\ncase \"$status\" in\n  identical|behind) ;;\n  *) echo \"The tagged commit $GITHUB_SHA is not on main: $status\" >&2; exit 1 ;;\nesac\nfor _ in $(seq 1 160); do\n  state=\"$(gh api \"repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$GITHUB_SHA&per_page=1\" --jq '.workflow_runs[0] | \"\\(.status) \\(.conclusion // \"\")\"')\"\n  case \"$state\" in\n    \"completed success\") exit 0 ;;\n    completed*) echo \"The main CI of $GITHUB_SHA ended with: $state\" >&2; exit 1 ;;\n  esac\n  sleep 30\ndone\necho \"The main CI of $GITHUB_SHA did not end in time\" >&2\nexit 1"
        }
      ]
    },
    "publish": {
      "runs-on": "macos-15",
      "timeout-minutes": 15,
      "needs": [
        "release_check"
      ],
      "if": "${{ success() && needs.release_check.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}",
      "permissions": {
        "contents": "write",
        "id-token": "write"
      },
      "concurrency": {
        "group": "npm-release-${{ github.ref }}",
        "cancel-in-progress": false
      },
      "env": {
        "NPM_CONFIG_REGISTRY": "https://registry.npmjs.org"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "26.9.0",
            "architecture": "arm64",
            "registry-url": "https://registry.npmjs.org",
            "package-manager-cache": false
          }
        },
        {
          "id": "validate-tag",
          "name": "Require the manifest version tag",
          "run": "version=\"$(node -p 'require(\"./package.json\").version')\"\ntest \"$GITHUB_REF_NAME\" = \"v$version\"\ntest \"$GITHUB_REF\" = \"refs/tags/$GITHUB_REF_NAME\""
        },
        {
          "run": "npm install --global npm@11.19.1 --ignore-scripts"
        },
        {
          "run": "npm ci --ignore-scripts"
        },
        {
          "run": "npm run build"
        },
        {
          "id": "publish-package",
          "name": "Publish a confirmed missing version with OIDC",
          "run": "version=\"$(node -p 'require(\"./package.json\").version')\"\nmetadata=\"$(mktemp)\"\ntrap 'rm -f \"$metadata\"' EXIT\nif npm view \"cloving@$version\" version --json > \"$metadata\"; then\n  node --input-type=module -e 'import { readFileSync } from \"node:fs\"; if (JSON.parse(readFileSync(process.argv[1], \"utf8\")) !== process.argv[2]) throw new Error(\"unexpected-registry-version\");' \"$metadata\" \"$version\"\nelse\n  node --input-type=module -e 'import { readFileSync } from \"node:fs\"; if (JSON.parse(readFileSync(process.argv[1], \"utf8\"))?.error?.code !== \"E404\") throw new Error(\"registry-lookup-failed\");' \"$metadata\"\n  npm publish --access public --ignore-scripts\nfi"
        },
        {
          "id": "github-release",
          "name": "Create a missing GitHub release",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "response=\"$(mktemp)\"\ntrap 'rm -f \"$response\"' EXIT\nif gh api --include \"repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME\" > \"$response\"; then\n  exit 0\nfi\nnode --input-type=module -e 'import { readFileSync } from \"node:fs\"; if (!/^HTTP\\/[\\d.]+ 404\\b/m.test(readFileSync(process.argv[1], \"utf8\"))) throw new Error(\"release-lookup-failed\");' \"$response\"\ngh release create \"$GITHUB_REF_NAME\" --repo \"$GITHUB_REPOSITORY\" --verify-tag --target \"$GITHUB_SHA\" --generate-notes"
        }
      ]
    }
  }
}
